name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: api_lab_app
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: api_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U api_lab_app -d api_lab_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        env:
          PGPASSWORD: testpassword
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U api_lab_app \
            -d api_lab_test \
            -f tests/schema.sql

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: api_lab_test
          DB_USER: api_lab_app
          DB_PASSWORD: testpassword

          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: api_lab_test
          TEST_DB_USER: api_lab_app
          TEST_DB_PASSWORD: testpassword
        run: |
          pytest -v
